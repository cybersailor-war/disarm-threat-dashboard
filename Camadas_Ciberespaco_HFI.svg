<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cardRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="flow12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="flow23" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- ================= NODE 1: CAMADA LÓGICA / SINTÁTICA ================= -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="340" height="240" rx="20" fill="url(#cardSky)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7"/>
    
    <!-- Top Badge -->
    <rect x="24" y="22" width="110" height="26" rx="13" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
    <text x="79" y="39" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">1ª CAMADA</text>
    <text x="316" y="40" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MEIO TÉCNICO</text>

    <!-- Visual Icon: Terminal + Exfiltration Packet -->
    <g transform="translate(24, 68)">
      <rect x="0" y="0" width="76" height="64" rx="12" fill="#070A12" stroke="#38BDF8" stroke-width="1.8"/>
      <circle cx="14" cy="13" r="3" fill="#FB7185"/>
      <circle cx="24" cy="13" r="3" fill="#FBBF24"/>
      <circle cx="34" cy="13" r="3" fill="#34D399"/>
      <path d="M16 32 L26 40 L16 48" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="32" y1="48" x2="54" y2="48" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Labels inside Node 1 -->
    <text x="116" y="92" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Camada Lógica /</text>
    <text x="116" y="116" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Sintática</text>

    <!-- Visual Tags -->
    <g transform="translate(24, 154)">
      <rect x="0" y="0" width="292" height="62" rx="10" fill="#070A12" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">• Intrusão em Redes e Sistemas</text>
      <text x="16" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">• Exfiltração / Alteração de Dados</text>
    </g>
  </g>

  <!-- ================= CONNECTOR 1 -> 2 ================= -->
  <g transform="translate(356, 115)">
    <line x1="0" y1="25" x2="62" y2="25" stroke="url(#flow12)" stroke-width="3.5" stroke-dasharray="6,4"/>
    <polygon points="60,16 74,25 60,34" fill="#FBBF24"/>
    <text x="37" y="10" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">INSUMO</text>
  </g>

  <!-- ================= NODE 2: CAMADA SEMÂNTICA ================= -->
  <g transform="translate(430, 20)">
    <rect x="0" y="0" width="340" height="240" rx="20" fill="url(#cardAmber)" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
    
    <!-- Top Badge -->
    <rect x="24" y="22" width="110" height="26" rx="13" fill="#D97706" fill-opacity="0.3" stroke="#FBBF24" stroke-width="1"/>
    <text x="79" y="39" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">2ª CAMADA</text>
    <text x="316" y="40" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">VETOR INFORMACIONAL</text>

    <!-- Visual Icon: Document + Tainted Leak -->
    <g transform="translate(24, 68)">
      <rect x="0" y="0" width="76" height="64" rx="12" fill="#070A12" stroke="#FBBF24" stroke-width="1.8"/>
      <line x1="16" y1="18" x2="48" y2="18" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="16" y1="30" x2="60" y2="30" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="42" x2="42" y2="42" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="56" cy="44" r="9" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" stroke-width="1.8"/>
      <text x="56" y="48" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">!</text>
    </g>

    <!-- Labels inside Node 2 -->
    <text x="116" y="92" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Camada</text>
    <text x="116" y="116" fill="#FBBF24" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Semântica</text>

    <!-- Visual Tags -->
    <g transform="translate(24, 154)">
      <rect x="0" y="0" width="292" height="62" rx="10" fill="#070A12" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">• Vazamentos e Adulteração</text>
      <text x="16" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">• Contaminação Informacional</text>
    </g>
  </g>

  <!-- ================= CONNECTOR 2 -> 3 ================= -->
  <g transform="translate(776, 115)">
    <line x1="0" y1="25" x2="62" y2="25" stroke="url(#flow23)" stroke-width="3.5" stroke-dasharray="6,4"/>
    <polygon points="60,16 74,25 60,34" fill="#FB7185"/>
    <text x="37" y="10" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">IMPACTO</text>
  </g>

  <!-- ================= NODE 3: CAMADA COGNITIVA / TOMADA DE DECISÃO ================= -->
  <g transform="translate(850, 20)">
    <rect x="0" y="0" width="340" height="240" rx="20" fill="url(#cardRose)" stroke="#FB7185" stroke-width="2" stroke-opacity="0.7"/>
    
    <!-- Top Badge -->
    <rect x="24" y="22" width="110" height="26" rx="13" fill="#E11D48" fill-opacity="0.3" stroke="#FB7185" stroke-width="1"/>
    <text x="79" y="39" text-anchor="middle" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">3ª CAMADA</text>
    <text x="316" y="40" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EFEITO FINAL</text>

    <!-- Visual Icon: Target / Decision Loop -->
    <g transform="translate(24, 68)">
      <rect x="0" y="0" width="76" height="64" rx="12" fill="#070A12" stroke="#FB7185" stroke-width="1.8"/>
      <circle cx="38" cy="32" r="19" fill="none" stroke="#FB7185" stroke-width="2" stroke-dasharray="5,3"/>
      <circle cx="38" cy="32" r="9" fill="#FB7185" fill-opacity="0.25" stroke="#FB7185" stroke-width="2"/>
      <circle cx="38" cy="32" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Labels inside Node 3 -->
    <text x="116" y="92" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Camada Cognitiva /</text>
    <text x="116" y="116" fill="#FB7185" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Tomada de Decisão</text>

    <!-- Visual Tags -->
    <g transform="translate(24, 154)">
      <rect x="0" y="0" width="292" height="62" rx="10" fill="#070A12" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">• Atrito Cognitivo e Hesitação</text>
      <text x="16" y="46" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">• Perda de Confiança Institucional</text>
    </g>
  </g>
</svg>