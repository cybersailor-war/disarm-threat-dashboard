<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#091020" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B1328" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cardIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0D1226" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- NODE 1: CAMADA LÓGICA / SINTÁTICA -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="340" height="230" rx="22" fill="url(#cardCyan)" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.65"/>
    <rect x="24" y="22" width="124" height="26" rx="13" fill="#0891B2" fill-opacity="0.28" stroke="#22D3EE" stroke-width="1"/>
    <text x="86" y="39" text-anchor="middle" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">1. MEIO TÉCNICO</text>

    <!-- Icon Terminal -->
    <g transform="translate(24, 66)">
      <rect x="0" y="0" width="70" height="60" rx="14" fill="#040711" stroke="#22D3EE" stroke-width="1.6"/>
      <path d="M18 24 L28 32 L18 40" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="34" y1="40" x2="50" y2="40" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="110" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Camada Lógica /</text>
    <text x="110" y="115" fill="#22D3EE" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Sintática</text>

    <g transform="translate(24, 146)">
      <rect x="0" y="0" width="292" height="60" rx="12" fill="#040711" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">• Invasão de sistemas e redes</text>
      <text x="16" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">• Exfiltração ou sabotagem lógica</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g transform="translate(356, 105)">
    <line x1="0" y1="25" x2="62" y2="25" stroke="url(#line1)" stroke-width="3.5" stroke-dasharray="6,4"/>
    <polygon points="60,16 74,25 60,34" fill="#60A5FA"/>
    <text x="37" y="10" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">GATILHO</text>
  </g>

  <!-- NODE 2: CAMADA SEMÂNTICA -->
  <g transform="translate(430, 15)">
    <rect x="0" y="0" width="340" height="230" rx="22" fill="url(#cardBlue)" stroke="#60A5FA" stroke-width="1.6" stroke-opacity="0.65"/>
    <rect x="24" y="22" width="160" height="26" rx="13" fill="#1D4ED8" fill-opacity="0.28" stroke="#60A5FA" stroke-width="1"/>
    <text x="104" y="39" text-anchor="middle" fill="#BFDBFE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">2. VETOR INFORMACIONAL</text>

    <!-- Icon Document / Tainted Leak -->
    <g transform="translate(24, 66)">
      <rect x="0" y="0" width="70" height="60" rx="14" fill="#040711" stroke="#60A5FA" stroke-width="1.6"/>
      <line x1="16" y1="19" x2="44" y2="19" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="16" y1="30" x2="54" y2="30" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="41" x2="38" y2="41" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <text x="110" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Camada</text>
    <text x="110" y="115" fill="#93C5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Semântica</text>

    <g transform="translate(24, 146)">
      <rect x="0" y="0" width="292" height="60" rx="12" fill="#040711" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">• Vazamentos e Tainted Leaks</text>
      <text x="16" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">• Narrativas e desinformação</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g transform="translate(776, 105)">
    <line x1="0" y1="25" x2="62" y2="25" stroke="url(#line2)" stroke-width="3.5" stroke-dasharray="6,4"/>
    <polygon points="60,16 74,25 60,34" fill="#818CF8"/>
    <text x="37" y="10" text-anchor="middle" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">EFEITO</text>
  </g>

  <!-- NODE 3: CAMADA COGNITIVA / TOMADA DE DECISÃO -->
  <g transform="translate(850, 15)">
    <rect x="0" y="0" width="340" height="230" rx="22" fill="url(#cardIndigo)" stroke="#818CF8" stroke-width="1.6" stroke-opacity="0.65"/>
    <rect x="24" y="22" width="145" height="26" rx="13" fill="#3730A3" fill-opacity="0.32" stroke="#818CF8" stroke-width="1"/>
    <text x="96" y="39" text-anchor="middle" fill="#C7D2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">3. ALVO FINAL (OODA)</text>

    <!-- Icon Brain / Target -->
    <g transform="translate(24, 66)">
      <rect x="0" y="0" width="70" height="60" rx="14" fill="#040711" stroke="#818CF8" stroke-width="1.6"/>
      <circle cx="35" cy="30" r="17" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,3"/>
      <circle cx="35" cy="30" r="8" fill="#4338CA" fill-opacity="0.35" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="35" cy="30" r="2.5" fill="#FFFFFF"/>
    </g>

    <text x="110" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Camada Cognitiva /</text>
    <text x="110" y="115" fill="#A5B4FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Tomada de Decisão</text>

    <g transform="translate(24, 146)">
      <rect x="0" y="0" width="292" height="60" rx="12" fill="#040711" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">• Atrito cognitivo e hesitação</text>
      <text x="16" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">• Paralisia decisória e perda de confiança</text>
    </g>
  </g>
</svg>
